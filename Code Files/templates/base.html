<!doctype html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FitBuddy{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
